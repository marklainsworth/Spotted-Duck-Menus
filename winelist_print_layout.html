<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wine List, Print Layout (v1.0 data)</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     PRINT LAYOUT WORKSHOP
     This file exists only to design the printed wine list.
     - The page you see on screen is an exact preview of the print sheet.
     - Edit the .sheet styles below (or the buildSheet() markup) and reload.
     - Click "Print / Save as PDF" to produce the PDF via the browser.
     - Sample data lives in WINES at the bottom; swap freely.
     The two style blocks are kept deliberately identical:
       (a) the screen preview (.sheet ...) so you see what you get, and
       (b) the @media print block so the PDF matches the preview.
     When you change one, change the other, or move both into shared
     classes. They are split here so you can tune screen vs paper
     independently if you ever need to.
     ============================================================ */

  :root{
    --gold:#8a6d3b;        /* category labels */
    --rule:#b8a98c;        /* header rule */
    --rule-soft:#e0d8c8;   /* category underline */
    --ink:#1b1b1b;         /* main text */
    --meta:#888;           /* region / varietal */
    --sub:#7a6f52;         /* "WINE LIST" eyebrow */
  }

  /* ---------- workshop chrome (NOT printed) ---------- */
  body{margin:0;background:#3a3346;font-family:'Jost',sans-serif;}
  .toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;
    background:#241c33;color:#efe9df;padding:12px 20px;border-bottom:1px solid #4a4060;}
  .toolbar h1{font-size:14px;font-weight:500;letter-spacing:.4px;margin:0;color:#e0c074;}
  .toolbar .spacer{flex:1;}
  .toolbar button{font-family:'Jost',sans-serif;font-size:13px;font-weight:500;cursor:pointer;
    border-radius:8px;padding:9px 16px;border:1px solid #6a5b86;background:#2e2542;color:#efe9df;transition:.15s;}
  .toolbar button:hover{background:#3a2f54;border-color:#8a79ad;}
  .toolbar button.primary{background:linear-gradient(160deg,#e0c074,#c9a86a);color:#241c33;border:none;font-weight:600;}
  .toolbar .hint{font-size:12px;color:#9387a6;}

  .stage{padding:30px 16px 60px;display:flex;justify-content:center;}

  /* ---------- discrete page sheets ----------
     Each .page is one printed Letter page. On screen they stack with a gap
     so you SEE the pagination. In print each .page starts on a fresh sheet. */
  .pages{display:flex;flex-direction:column;align-items:center;gap:26px;}
  .page{
    width:816px;min-height:1056px;box-sizing:border-box;
    background:#fff;color:var(--ink);
    font-family:'Cormorant Garamond',Georgia,serif;
    padding:54px 64px;
    box-shadow:0 10px 40px rgba(0,0,0,.4);
  }
  .ps-head{display:flex;align-items:center;gap:20px;border-bottom:2px solid var(--rule);padding-bottom:16px;margin-bottom:22px;}
  .ps-logo{height:72px;width:auto;flex:0 0 auto;display:block;}
  .ps-head-txt{flex:1;min-width:0;}
  .ps-title-row{display:flex;align-items:baseline;justify-content:space-between;gap:18px;}
  .ps-title{font-size:40px;font-weight:700;letter-spacing:1px;line-height:1;}
  .ps-sub{font-size:13px;letter-spacing:5px;text-transform:uppercase;color:var(--sub);
    font-family:'Jost',sans-serif;white-space:nowrap;}
  .ps-date{font-size:11px;color:#999;font-family:'Jost',sans-serif;margin-top:8px;}

  .ps-section{break-inside:avoid;margin-bottom:18px;}
  .ps-cat{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;font-family:'Jost',sans-serif;
    color:var(--gold);border-bottom:1px solid var(--rule-soft);padding-bottom:6px;margin:16px 0 11px;}
  .ps-wine{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin:8px 0;}
  .ps-w-name{font-size:19px;font-weight:600;}
  .ps-w-vint{color:#a07b3b;}
  .ps-w-meta{font-size:11px;color:var(--meta);font-family:'Jost',sans-serif;margin-left:10px;font-weight:400;}
  .ps-w-price{font-size:14px;font-weight:600;white-space:nowrap;font-family:'Jost',sans-serif;}
  .ps-foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--rule-soft);text-align:center;
    font-family:'Jost',sans-serif;color:#8a8276;}
  .ps-foot .addr{font-size:12px;letter-spacing:.5px;color:#6a6258;}
  .ps-foot .contact{font-size:11px;letter-spacing:1px;color:#9a9286;margin-top:5px;text-transform:uppercase;}

  /* ---------- PRINT: what actually goes to PDF ---------- */
  @media print{
    @page{ size:Letter; margin:0.55in; }
    html,body{background:#fff;margin:0;padding:0;}
    .toolbar{display:none !important;}
    .stage{display:block;padding:0;margin:0;}
    .pages{display:block;gap:0;}
    .page{
      width:auto;min-height:0;box-shadow:none;padding:0;
      break-after:page;page-break-after:always;
    }
    .page:last-child{ break-after:auto;page-break-after:auto; }
  }
</style>

  function priceText(card){
    if(card.rows && card.rows.length){
      return card.rows.map(r=>r[0]+' '+r[1]).join('\u2003/\u2003');
    }
    return card.single || '';
  }

  function renderSection(section, extraClass){
    let h = '<div class="ps-section'+(extraClass?' '+extraClass:'')+'"><div class="ps-cat">'+section.sec+'</div>';
    section.cards.forEach(card=>{
      const meta = (card.metas||[]).join(' \u00b7 ');
      const price = priceText(card);
      h +=
        '<div class="ps-wine">'+
          '<div><span class="ps-w-name">'+card.name+'</span>'+
          (meta ? '<span class="ps-w-meta">'+meta+'</span>' : '')+'</div>'+
          '<div class="ps-w-price">'+price+'</div>'+
        '</div>';
    });
    h += '</div>';
    return h;
  }

  function headerHtml(){
    return '<div class="ps-head">'+
      '<img class="ps-logo" src="https://images.squarespace-cdn.com/content/v1/64499bef98adda64f34bdefc/dc7de386-05fd-40f6-b702-1983be045ace/Spotted+Duck-Final.png?format=1500w" alt="The Spotted Duck" onerror="this.style.display=\'none\';">'+
      '<div class="ps-head-txt">'+
        '<div class="ps-title-row"><span class="ps-title">Spotted Duck</span><span class="ps-sub">Wine List</span></div>'+
        '<div class="ps-date">'+fmtDateLong(new Date())+'</div>'+
      '</div>'+
    '</div>';
  }

  function footHtml(){
    return '<div class="ps-foot">'+
      '<div class="addr">542 Lighthouse Ave, Pacific Grove, CA 93950</div>'+
      '<div class="contact">831-920-2662 &nbsp;&middot;&nbsp; @spottedduckpg</div>'+
    '</div>';
  }

  function buildSheet(){
    const find = name => MENU.find(s => s.sec === name);
    const FIRST = 'Session Cocktails';
    const LAST  = 'Water + Soda';
    const middle = MENU.filter(s => s.sec !== FIRST && s.sec !== LAST);

    let html = '';

    // --- Page 1: Session Cocktails, on its own page ---
    const cocktails = find(FIRST);
    if(cocktails){
      html += '<div class="page">' + headerHtml() + renderSection(cocktails) + '</div>';
    }

    // --- Middle page(s): wine and everything else, in the menu's order ---
    let mid = headerHtml();
    middle.forEach(section => { mid += renderSection(section); });
    html += '<div class="page">' + mid + '</div>';

    // --- Last page: Beverages, on its own page, with the footer ---
    const bev = find(LAST);
    if(bev){
      html += '<div class="page">' + headerHtml() + renderSection(bev) + footHtml() + '</div>';
    }

    document.getElementById('pages').innerHTML = html;
  }
  function rebuild(){ buildSheet(); }
  buildSheet();
